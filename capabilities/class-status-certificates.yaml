naftiko: 1.0.0-alpha2
info:
  label: DNV Class Status API — Certificates
  description: 'DNV Class Status API — Certificates. 1 operations. Lead operation: Get vessel classification certificates.
    Self-contained Naftiko capability covering one Dnv business surface.'
  tags:
  - Dnv
  - Certificates
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DNV_API_KEY: DNV_API_KEY
capability:
  consumes:
  - type: http
    namespace: class-status-certificates
    baseUri: https://maritime.dnv.com/api/cs-iacs-customer
    description: DNV Class Status API — Certificates business capability. Self-contained, no shared references.
    resources:
    - name: vessels-imoNumber-certificates
      path: /vessels/{imoNumber}/certificates
      operations:
      - name: getvesselcertificates
        method: GET
        description: Get vessel classification certificates
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: imoNumber
          in: path
          type: string
          required: true
        - name: certificateType
          in: query
          type: string
          description: Filter by certificate type
        - name: status
          in: query
          type: string
          description: Filter by certificate validity status
    authentication:
      type: bearer
      token: '{{env.DNV_API_KEY}}'
  exposes:
  - type: rest
    namespace: class-status-certificates-rest
    port: 8080
    description: REST adapter for DNV Class Status API — Certificates. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/vessels/{imonumber}/certificates
      name: vessels-imonumber-certificates
      description: REST surface for vessels-imoNumber-certificates.
      operations:
      - method: GET
        name: getvesselcertificates
        description: Get vessel classification certificates
        call: class-status-certificates.getvesselcertificates
        with:
          imoNumber: rest.imoNumber
          certificateType: rest.certificateType
          status: rest.status
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: class-status-certificates-mcp
    port: 9090
    transport: http
    description: MCP adapter for DNV Class Status API — Certificates. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-vessel-classification-certificates
      description: Get vessel classification certificates
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: class-status-certificates.getvesselcertificates
      with:
        imoNumber: tools.imoNumber
        certificateType: tools.certificateType
        status: tools.status
      outputParameters:
      - type: object
        mapping: $.
