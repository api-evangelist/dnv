specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: DNV
providerId: dnv
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Maritime
  - Energy
  - Classification
  - Vessel
  - Data Platform
description: DNV does not publish public pricing for its Maritime classification APIs (e.g. Class Status,
  IACS-75). Access is granted only after a separate API contract is signed with DNV. The Veracity data
  platform exposes some open applications but customer-only APIs (including Class Status) are gated by
  contract. Pricing is negotiated with the local DNV representative.
sources:
  - https://maritime.dnv.com/api/cs-iacs-customer
  - https://maritime.dnv.com/api/cs-iacs-customer/docs/index.html
  - https://www.dnv.com/maritime/
  - https://www.veracity.com/
notes: No public pricing is published; reconciled=false. Plans below describe access classes (open Veracity
  apps vs. contract-gated customer APIs) rather than commercial tiers.
plans:
  - id: dnv-veracity-open
    name: Veracity Open Applications
    type: freemium
    description: Open applications on the Veracity platform available to all registered users.
    entries:
      - label: Open access
        name: open_access
        type: subscription
        metric: account
        limit: 1
        timeFrame: year
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Veracity account registration
      - name: Open data sets and applications
  - id: dnv-customer-contract
    name: DNV Customer API Contract
    type: enterprise
    description: Contracted access to DNV customer APIs (e.g. Class Status / IACS-75). Requires a signed
      API contract, with Azure AD B2C OAuth 2.0 client credentials issued to the named technical contact.
    entries:
      - label: Negotiated contract
        name: contract
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Class Status API (IACS-75)
      - name: Vessel Register integrations
      - name: Azure AD B2C OAuth 2.0 client credentials
      - name: Named technical contact / contract
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
