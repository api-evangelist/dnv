description: FOCUS-aligned FinOps shape for DNV Maritime APIs. DNV does not publish a per-call meter;
  cost is governed by the negotiated API contract (often bundled with classification or advisory services).
notes: No public pricing or per-meter billing is published; reconciled=false. Meters below describe the
  consumption surface that a customer would observe internally.
sources:
  - https://maritime.dnv.com/api/cs-iacs-customer
  - https://www.dnv.com/maritime/
billingModel:
  pricingCategory: Enterprise Contract
  billingFrequency: Per-Invoice
  billingCurrency: USD/EUR/NOK
  chargeCategories:
    - Purchase
    - Tax
focusColumns:
  ServiceName: DNV Maritime APIs
  ServiceCategory: Maritime Classification / Data Platform
  ProviderName: DNV
  PublisherName: DNV AS
  InvoiceIssuerName: DNV AS
  BillingCurrency: USD/EUR/NOK
  ChargeCategory: Purchase
meters:
  - name: api_requests
    description: Internal observability of calls against DNV APIs
    unit: request
    aggregation: sum
    dimensions:
      - api
      - vessel_imo
  - name: contract_seats
    description: Active named technical contacts under the API contract
    unit: seat
    aggregation: count
    dimensions:
      - contract
principles:
  - name: Visibility
    description: DNV invoices are issued under the API/classification contract; reconcile against contracted
      services rather than per-call usage.
  - name: Allocation
    description: Allocate DNV cost to the fleet/vessel program that consumes class-status and IACS-75 data.
  - name: Optimization
    description: Cache class-status responses; reuse OAuth tokens (~20 min validity) across requests; coalesce
      vessel-IMO lookups.
  - name: Accountability
    description: The named technical contact on the API contract is accountable for credential security
      and adherence to the contracted scope.
